# dsh 用户设置（Web UI 设置页也会写到这里）
agent-presets:
  default: router-standard

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers: {}
agent-default-model:
  provider: vision-toolkit-one-model
  model: deepseek-v4-flash
permission:
  defaultPreset: danger-full-access
ui-theme:
  preference: dark
vision-toolkit:
  provider:
    baseUrl: https://one-model.com/v1
    credential: ANIONEX_FREE_VISION
    model: mimo-v2.5
    protocol: openai
    anthropicThinking: omit
    userAgent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
      like Gecko) Chrome/126.0.0.0 Safari/537.36
  language: zh
  timeoutMs: 60000
  maxImageBytes: 4194304
  maxImagePixels: 20000000
  concurrency: 4
  runtime:
    mode: managed
  allowedDirs: []
